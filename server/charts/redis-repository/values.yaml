
namespace: marketplace

replicaCount: 1


image:
  repository: redis
  tag: "7-alpine"
  pullPolicy: IfNotPresent
  pullSecret: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 6379

ingress:
  enabled: false

persistence:
    enabled: false


env: 
  - name: REDIS_USERNAME
    valueFrom:
      secretKeyRef:
        name: redis-credentials
        key: username
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: redis-credentials
        key: password
  - name: REDIS_MAXMEMORY
    value: "768mb"
  - name: REDIS_MAXMEMORY_POLICY
    value: "allkeys-lru"


nodeSelector:
  role: marketplace

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 500m
    

cluster:
  enabled: false


livenessProbe:
  tcpSocket:
    port: 6379
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  exec:
    command:
      - redis-cli
      - --no-auth-warning
      - -u
      - redis://$(REDIS_USERNAME):$(REDIS_PASSWORD)@localhost:6379
      - ping
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5
startupProbe:
  exec:
    command:
      - redis-cli
      - --no-auth-warning
      - -u
      - redis://$(REDIS_USERNAME):$(REDIS_PASSWORD)@localhost:6379
      - ping
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 10


tolerations: []
affinity: {}
